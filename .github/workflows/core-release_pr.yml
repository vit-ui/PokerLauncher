name: core-release_pr
on:
  push:
    branches: [master]
permissions:
  contents: write
  pull-requests: write
jobs:
  core-release_pr:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: simple
